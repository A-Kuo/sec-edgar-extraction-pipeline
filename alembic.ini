[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[sqlalchemy]
sqlalchemy.url = postgresql://sec_user:sec_pass@localhost/sec_edgar

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

script_location = migrations

sqlalchemy.url = driver://user:pass@localhost/dbname

version_path_separator = :

version_locations = %(here)s/migrations/versions

sqlalchemy.url = driver://user:pass@localhost/dbname

compare_type = false

compare_server_default = false

include_symbol = None

include_object = None

transactional_ddl = true

user_module_name = None
