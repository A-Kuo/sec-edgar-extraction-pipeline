[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Set via DATABASE_URL env var at runtime; override here for local dev if needed.
sqlalchemy.url = postgresql://sec_user:sec_pass@localhost/sec_edgar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
