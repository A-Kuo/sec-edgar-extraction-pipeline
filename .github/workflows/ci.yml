name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref. main is exempt so
  # every commit there keeps a complete status history.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MOCK_EDGAR: "true"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: mypy
        run: mypy src api scripts

  # --------------------------------------------------------------------------
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src --cov=api --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # --------------------------------------------------------------------------
  # The DAG and the migrations are the two things unit tests cannot vouch for:
  # tests/test_dag.py mocks Airflow away, and nothing exercises Alembic. This
  # job runs both against the real dependencies. It exists because an unbounded
  # `apache-airflow>=2.8.0` once resolved to a major version that removed
  # `schedule_interval` — the DAG stopped importing and the suite stayed green.
  dag-and-migrations:
    name: DAG import and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sec_user
          POSTGRES_PASSWORD: sec_pass
          POSTGRES_DB: sec_edgar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sec_user -d sec_edgar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sec_user:sec_pass@localhost:5432/sec_edgar
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Assert every table exists
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          expected = {
              "filings_raw", "financial_facts", "filing_versions",
              "pipeline_audit", "model_runs", "fact_anomalies",
              "extraction_audit",
          }
          inspector = inspect(create_engine(os.environ["DATABASE_URL"]))
          actual = set(inspector.get_table_names())
          missing = expected - actual
          assert not missing, f"Migration did not create: {sorted(missing)}"
          print("All tables present:", sorted(expected))
          PY

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check for un-migrated model changes
        run: |
          # A model edited without a matching revision would silently diverge
          # from the deployed schema. Autogenerate against the migrated
          # database and fail if it finds anything left to do.
          alembic check

      - name: Verify audit tables are append-only (Postgres trigger)
        run: |
          # migration 2cf6396ba519 installs a BEFORE UPDATE OR DELETE trigger
          # on pipeline_audit and extraction_audit, but only on PostgreSQL —
          # SQLite (used everywhere else in the test suite) silently skips it,
          # so this is the only place the trigger itself is ever exercised.
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])

          def assert_append_only(table: str, insert_sql: str, params: dict) -> None:
              with engine.begin() as conn:
                  row_id = conn.execute(text(insert_sql), params).scalar_one()

              with engine.connect() as conn:
                  try:
                      conn.execute(
                          text(f"UPDATE {table} SET id = id WHERE id = :id"), {"id": row_id}
                      )
                      conn.commit()
                  except Exception as exc:
                      conn.rollback()
                      assert "append-only" in str(exc), f"unexpected {table} UPDATE error: {exc}"
                  else:
                      raise AssertionError(f"{table} allowed an UPDATE — trigger did not fire")

              with engine.connect() as conn:
                  try:
                      conn.execute(text(f"DELETE FROM {table} WHERE id = :id"), {"id": row_id})
                      conn.commit()
                  except Exception as exc:
                      conn.rollback()
                      assert "append-only" in str(exc), f"unexpected {table} DELETE error: {exc}"
                  else:
                      raise AssertionError(f"{table} allowed a DELETE — trigger did not fire")

              print(f"{table}: UPDATE and DELETE both correctly rejected")

          assert_append_only(
              "pipeline_audit",
              """INSERT INTO pipeline_audit (run_id, stage, status)
                 VALUES (:run_id, :stage, :status) RETURNING id""",
              {"run_id": "ci-trigger-check", "stage": "ingest", "status": "completed"},
          )

          assert_append_only(
              "extraction_audit",
              """INSERT INTO extraction_audit
                     (run_id, system_id, stage, extraction_status, row_hash)
                 VALUES (:run_id, :system_id, :stage, :extraction_status, :row_hash)
                 RETURNING id""",
              {
                  "run_id": "ci-trigger-check",
                  "system_id": "ci",
                  "stage": "download",
                  "extraction_status": "success",
                  "row_hash": "0" * 64,
              },
          )
          PY

      - name: Import the DAG against real Airflow
        run: pytest tests/test_dag_import.py -v

      - name: Verify Redis connectivity
        run: |
          python - <<'PY'
          import os
          from src.cache import FilingCache

          cache = FilingCache(os.environ["REDIS_URL"])
          assert cache.ping(), "Redis did not respond to PING"
          cache.set_cik("AAPL", "320193")
          assert cache.get_cik("AAPL") == "320193"
          print("Redis round-trip OK")
          PY

  # --------------------------------------------------------------------------
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7.0,<3"

      - name: Audit dependencies
        # Advisories are reported but do not block: this pipeline pulls the
        # whole Airflow dependency tree, and a transitive advisory with no fix
        # available should not wedge every unrelated PR. The report is attached
        # to the run so a real finding is still visible and actionable.
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --desc --format=markdown \
            | tee "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, dag-and-migrations]
    if: always()
    steps:
      # Single required status check for branch protection. Without this, a
      # skipped or cancelled matrix job reads as "not failed" and a broken PR
      # can merge.
      - name: Assert all required jobs succeeded
        run: |
          results="${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.dag-and-migrations.result }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed ($result)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
