name: CI

on:
  push:
    branches: [main, claude/sharp-goodall-lzOCy]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sec_user
          POSTGRES_PASSWORD: sec_pass
          POSTGRES_DB: sec_edgar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ api/ dags/ scripts/ tests/
          ruff format --check src/ api/ dags/ scripts/ tests/

      - name: Type check with mypy
        run: |
          mypy src/ api/ dags/ scripts/ --ignore-missing-imports || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://sec_user:sec_pass@localhost/sec_edgar
          REDIS_URL: redis://localhost:6379/0
          MOCK_EDGAR: "true"
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=api --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
